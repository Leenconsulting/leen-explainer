<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Leen in 80 seconds</title>
<meta property="og:title" content="Leen in 80 seconds">
<meta property="og:description" content="Build better teams. Win more work. Stay independent.">
<meta property="og:image" content="https://leenconsulting.github.io/leen-explainer/Leen_Explainer_v3_poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--lime:#F0FF9A}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Poppins,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px}
header,main{width:100%;max-width:1040px}
header img{height:30px;display:block}
main{margin-top:36px}
h1{font-weight:600;font-size:clamp(26px,4.2vw,42px);line-height:1.15;margin-bottom:22px}
h1 span{color:var(--lime)}
video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#111;display:block}
.cta{margin-top:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.cta p{font-size:18px}
.btn{background:var(--lime);color:#000;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:999px}
.btn:hover{filter:brightness(.92)}
</style>
</head>
<body>
<header><a href="https://leen.consulting"><img src="leen-logo.svg" alt="Leen"></a></header>
<main>
<h1>Leen in <span>80 seconds</span></h1>
<video controls playsinline preload="metadata" poster="Leen_Explainer_v3_poster.jpg">
<source src="Leen_Explainer_v3_1280x720.mp4" type="video/mp4">
</video>
<div class="cta"><p>Leen opens 30 November.</p><a class="btn" href="https://leen.consulting">Visit leen.consulting</a></div>
</main>
</body>
</html>
